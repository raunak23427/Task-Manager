{% extends "base.html" %}
{% block title %}Delete Project — TaskManager{% endblock %}

{% block content %}
<div class="form-card">
  <h1>Delete "{{ project.name }}"?</h1>
  <p>This will permanently delete the project and all its tasks and comments. This action cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <a href="{% url 'tasks:project_detail' project.pk %}" class="btn btn-outline">Cancel</a>
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
  </form>
</div>
{% endblock %}
