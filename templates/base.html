<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}TaskManager{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<nav class="navbar">
  <a class="navbar-brand" href="/">&#9642; TaskManager</a>
  <div class="navbar-links">
    {% if user.is_authenticated %}
      <a href="{% url 'tasks:dashboard' %}">Dashboard</a>
      <a href="{% url 'tasks:project_list' %}">Projects</a>
      <span class="navbar-user">{{ user.username }}</span>
      <form method="post" action="{% url 'accounts:logout' %}" style="display:inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm btn-outline">Log out</button>
      </form>
    {% else %}
      <a href="{% url 'accounts:login' %}">Log in</a>
      <a href="{% url 'accounts:register' %}">Register</a>
    {% endif %}
  </div>
</nav>

<div class="container">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
  {% endif %}

  {% block content %}{% endblock %}
</div>

</body>
</html>
